# Routine commands for 校日常. Run `mise tasks` to list them.
# Xcode, git and python3 come from the Xcode command line tools;
# `mise test-scripts` also needs node, `mise android` needs JDK 21.
#
# Override defaults with environment variables, for example
# `SIMULATOR="iPhone 17" mise test-app`. `mise run check` runs every check a
# commit must pass (build, test, scan). BUILD_CMD and TEST_CMD replace the
# xcodebuild and swift test commands (to run them on another machine);
# BUILD_CMD gets the configuration as its last argument.

[task_config]
dir = "{{config_root}}"

[tasks.setup]
description = "Fetch the pinned Alipay SDK and the shared hot-water profile (both Git-ignored)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -d Vendor/AlipaySDK-15.8.30/AlipaySDK.xcframework ] || python3 Scripts/fetch-alipay-sdk.py
[ -f private/distribution/WaterPlatformProfile.json ] || python3 Scripts/stage-water-profile.py fetch
'''

[tasks.build]
description = "Build App and Widget for iOS Simulator, Debug and Release"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cmd=${BUILD_CMD:-"xcodebuild build -workspace XiaoRiChang.xcworkspace -scheme App -destination 'generic/platform=iOS Simulator' -derivedDataPath .DerivedData -configuration"}
eval "$cmd Debug"
# Release only compiles with a hot-water profile. Without the real one
# (private/distribution/, or CAMPUS_WATER_PROFILE_PATH), this check build gets a
# synthetic platform-only profile; package-ipa still requires the real one.
if [ -z "${CAMPUS_WATER_PROFILE_PATH:-}" ] && [ ! -f private/distribution/WaterPlatformProfile.json ]; then
  CAMPUS_WATER_PROFILE_PATH=$(mktemp -d)/SyntheticWaterProfile.json
  printf '{"secret":"synthetic-release-check","sid":"synthetic","bleName":"SYNTHETIC","typeID":0,"version":1}\n' > "$CAMPUS_WATER_PROFILE_PATH"
  export CAMPUS_WATER_PROFILE_PATH
fi
eval "$cmd Release"
'''

[tasks.build-device]
description = "Build App and Widget for a generic iOS device"
run = '''
#!/usr/bin/env bash
set -euo pipefail
xcodebuild build -workspace XiaoRiChang.xcworkspace -scheme App \
  -configuration "${CONFIGURATION:-Debug}" -destination "generic/platform=iOS" \
  -derivedDataPath .DerivedData
'''

[tasks.test]
description = "Run every test: Core package and scripts"
run = [{ task = "test-core" }, { task = "test-scripts" }]

[tasks.test-core]
description = "Run the Core package tests on macOS"
run = 'eval "${TEST_CMD:-swift test --package-path Packages/Core --scratch-path .build-tests}"'

[tasks.test-app]
description = "Run the App.xctestplan on an iOS Simulator"
run = '''
#!/usr/bin/env bash
set -euo pipefail
xcodebuild test -workspace XiaoRiChang.xcworkspace -scheme App \
  -destination "platform=iOS Simulator,name=${SIMULATOR:-iPhone 17}" \
  -derivedDataPath .DerivedData
'''

[tasks.test-scripts]
description = "Run the Python script tests and the school-login automation test"
run = [
    "python3 -m unittest discover -s Scripts/Tests -p 'test_*.py'",
    "node --test Scripts/Tests/campus-login-automation.test.cjs",
]

[tasks.scan]
description = "Privacy checks on staged files: patterns, values in $LEAKCHECK_FILE, markers in $MARKER_PATTERNS (except $MARKER_ALLOW); a missing list fails"
run = "sh Scripts/privacy-check.sh"

[tasks.check]
description = "Every check before a commit: Debug and Release builds, all tests, privacy scans"
depends = ["build", "test", "scan"]
run = "echo 'all checks passed'"

[tasks.check-widget-signature]
description = "Check a signed app and its widget share one keychain group (APP=path/to/XiaoRiChang.app)"
run = 'python3 Scripts/check-widget-signature.py --app "$APP"'

[tasks.package-ipa]
description = "Package an unsigned Release build (APP=..., OUTPUT=..., PROFILE=...)"
run = 'python3 Scripts/package-ipa.py --app "$APP" --output "$OUTPUT" --platform-profile "$PROFILE"'

[tasks.android]
description = "Build, unit-test and lint the Android app"
run = 'bash Android/build-android.sh -PcampusWaterProfile="$PWD/private/distribution/WaterPlatformProfile.json"'

[tasks.clean]
description = "Remove derived data and SwiftPM build output"
run = "rm -rf .DerivedData .build-tests Packages/Core/.build"
